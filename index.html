<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Ram's Mobile Accessories & Design</title>
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=0" />
    <style>
:root {
  --royal-blue: #228bee;
  --matte-white: #f8fafc;
  --shadow: 0 4px 24px rgba(34, 139, 238, 0.09);
  --card-radius: 16px;
  --border: 1.5px solid #e9e9ea;
  --text-main: #1a2332;
  --text-muted: #4686b9;
}

body {
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
  background: var(--matte-white);
  margin: 0; padding: 0; box-sizing: border-box;
  color: var(--text-main); min-height: 100vh;
}

h2, h3 { color: var(--royal-blue); letter-spacing: 1.2px; font-weight: 550; margin-bottom: 0.6em; }

.section-card {
  background: #fff; border: var(--border); border-radius: var(--card-radius);
  box-shadow: var(--shadow); padding: 2em 1em 1.5em 1em;
  max-width: 480px; width: 96%; margin: 0 auto 2.2em auto;
}

.nav-btn {
  background: var(--royal-blue); color: #fff; border: none; border-radius: 28px;
  font-size: 1.07em; font-weight: 500; padding: 15px 30px;
  box-shadow: 0 2px 10px rgba(34, 139, 238, 0.13);
  transition: background 0.18s, transform 0.13s; margin: 0 12px 14px 0; outline: none;
}

.nav-btn:hover { background: #165fa1; transform: translateY(-2px); }

input[type="text"] {
  border-radius: 8px; border: var(--border); padding: 8px 0.8em;
  font-size: 1em; outline: none; width: 80%; margin-bottom: 10px; background: #f6fafd;
}

/* FIX: DESIGN GALLERY GRID (2 COLUMNS FOR MOBILE) */
#designGallery {
  display: grid !important;
  grid-template-columns: repeat(2, 1fr);
  gap: 12px;
  padding: 10px;
  justify-items: center;
}

#designGallery img {
  width: 100%;
  height: 240px; /* Made taller for better view */
  background: #fff; border: var(--border); border-radius: 13px;
  object-fit: cover; cursor: pointer;
}

/* FIX: GALLERY MODAL & NAVIGATION */
#imageModal {
  display: none; position: fixed; top: 0; left: 0;
  width: 100vw; height: 100vh; background: rgba(0, 0, 0, 0.95);
  justify-content: center; align-items: center; z-index: 1100;
  flex-direction: column;
}

#modalImage {
  max-width: 95vw; max-height: 75vh; border-radius: 8px;
  box-shadow: 0 8px 40px rgba(0,0,0,0.5);
}

.gallery-controls {
  display: flex; gap: 25px; margin-top: 20px;
}

/* Common list styles */
.models-list { background: #fafcff; border-radius: 13px; border: var(--border); padding: 10px; width: 190px; }
.main-model { font-weight: bold; color: var(--royal-blue); }
#suggestions { background: #fff; border: 2px solid var(--royal-blue); border-radius: 11px; position: absolute; max-height: 150px; overflow-y: auto; width: 80%; z-index: 99; display: none; }
.suggestion-item { padding: 10px; cursor: pointer; border-bottom: 1px solid #eef2fa; }
.hidden { display: none !important; }

/* Accessory styles */
.airdopes-grid { display: flex; flex-wrap: wrap; gap: 14px; justify-content: center; }
.airdopes-card { flex: 1 1 150px; max-width: 220px; }
.banner-slider { width: 100%; max-width: 480px; margin: 0 auto 16px auto; overflow: hidden; border-radius: 12px; background: #0b1b33; }
.banner-track { display: flex; transition: transform 0.4s ease; }
.banner-slide { min-width: 100%; display: flex; align-items: center; color: #fff; }
.banner-slide img { width: 35%; object-fit: cover; }
.brand-row { display: flex; justify-content: center; margin: 10px 0; }
.brand-row img { height: 32px; }

@media (max-width: 520px) {
  .section-card { width: 98vw; padding: 1em 0.5em; }
}
    </style>
  </head>
  <body>
    <div id="homeMenu" style="display: flex; flex-direction: column; height: 100vh">
      <div style="flex: 8; display: flex; flex-direction: column; align-items: center; justify-content: center; background: #f5fafe;">
        <h2 style="margin-bottom: 28px;">Customers</h2>
        <div style="display: flex; gap: 15px; flex-wrap: wrap; justify-content: center;">
          <button type="button" id="btnDesign" class="nav-btn">Design Selections</button>
          <button type="button" id="btnContact" class="nav-btn">Contact Us</button>
          <button type="button" id="btnAccessories" class="nav-btn">Accessories</button>
          <button type="button" id="btnNeckband" class="nav-btn">Neckband</button>
          <button type="button" id="btnPowerbank" class="nav-btn">Powerbank</button>
        </div>
      </div>
      <div style="flex: 2; display: flex; flex-direction: column; align-items: center; justify-content: center; background: #ebf3fb;">
        <h2 style="margin-bottom: 15px;">Staff</h2>
        <div style="display: flex; gap: 15px">
          <button type="button" id="btnTemperedGlass" class="nav-btn">Tempered Glass</button>
          <button type="button" id="btnBackCases" class="nav-btn">Back Cases</button>
        </div>
      </div>
    </div>

    <div id="temperedGlassPage" class="hidden section-card">
      <button onclick="goHome()" class="nav-btn" style="margin-bottom: 15px">Home</button>
      <h2>Tempered Glass Lookup</h2>
      <form id="searchForm" autocomplete="off">
        <input type="text" id="searchInput" placeholder="Enter phone model..." />
        <div id="suggestions"></div>
        <button type="submit" class="nav-btn">Search</button>
      </form>
      <div class="result" id="result"></div>
      <div id="modelsList" style="display:flex; flex-wrap:wrap; gap:10px; justify-content:center; margin-top:20px;"></div>
    </div>

    <div id="designSelectionsPage" class="hidden section-card">
      <button onclick="goHome()" class="nav-btn" style="margin-bottom: 15px">Home</button>
      <h2>Design Selections</h2>
      <div id="designButtons" style="display: flex; flex-wrap: wrap; justify-content: center; gap: 10px;"></div>
      <div id="designGallery"></div>
      <button id="backToDesigns" class="nav-btn" style="display: none; margin: 18px auto" onclick="showDesignButtons()">Back to Choices</button>

      <div id="imageModal">
        <span id="galleryCounter" style="color: white; margin-bottom: 10px; font-weight: bold;"></span>
        <img id="modalImage" src="" alt="Full Design" />
        <div class="gallery-controls">
            <button onclick="navigateGallery(-1)" class="nav-btn" style="background: #444;">&larr; Prev</button>
            <button onclick="navigateGallery(1)" class="nav-btn">Next &rarr;</button>
        </div>
        <div style="margin-top: 20px; display: flex; gap: 10px;">
          <button id="printImageBtn" class="nav-btn" style="background: #28a745;">WhatsApp / Print</button>
          <button id="closeModalBtn" class="nav-btn" style="background: #dc3545;">Close</button>
        </div>
      </div>
    </div>
    <div id="ipakyPage" class="hidden section-card">
      <button onclick="showPage('backCasesPage')" class="nav-btn" style="margin-bottom: 15px">Back</button>
      <h2>iPaky Compatibility</h2>
      <form id="ipakySearchForm" autocomplete="off">
        <input type="text" id="ipakySearchInput" placeholder="Enter model..." />
        <div id="ipakySuggestions"></div>
        <button type="submit" class="nav-btn">Search</button>
      </form>
      <div class="result" id="ipakyResult"></div>
      <div id="ipakyModelsList" style="display:flex; flex-wrap:wrap; gap:10px; justify-content:center;"></div>
    </div>

    <div id="backCasesPage" class="hidden section-card">
      <button onclick="goHome()" class="nav-btn" style="margin-bottom: 15px">Home</button>
      <h2>Back Cases</h2>
      <div style="display: flex; gap: 15px; justify-content: center;">
        <button id="btnIpaky" class="nav-btn">iPaky</button>
        <button onclick="alert('Coming soon!')" class="nav-btn">Premium</button>
      </div>
    </div>

    <div id="accessoriesPage" class="hidden section-card">
      <button onclick="goHome()" class="nav-btn" style="margin-bottom: 15px">Home</button>
      <h2>Accessories</h2>
      <div class="brand-row"><img src="images/boat-logo.png" alt="boAt" /></div>
      <div class="banner-slider" id="boatAirdopesBanner"><div class="banner-track"></div></div>
      <h3 id="airdopesSection">Airdopes</h3>
      <div id="airdopesModelsGrid" class="airdopes-grid"></div>
      <h3 id="neckbandSection" style="margin-top:20px;">Neckbands</h3>
      <div id="neckbandModelsGrid" class="airdopes-grid"></div>
    </div>

    <script src="data.js"></script>
    <script src="design-data.js"></script>

    <script>
      let currentGalleryImages = [];
      let currentImgIndex = 0;

      document.addEventListener("DOMContentLoaded", function () {
        function showPage(pageId) {
          document.querySelectorAll('.section-card, #homeMenu').forEach(el => el.classList.add('hidden'));
          document.getElementById(pageId).classList.remove('hidden');
        }
        window.showPage = showPage;
        window.goHome = () => showPage('homeMenu');

        // Navigation
        document.getElementById("btnDesign").onclick = () => showPage("designSelectionsPage");
        document.getElementById("btnTemperedGlass").onclick = () => showPage("temperedGlassPage");
        document.getElementById("btnBackCases").onclick = () => showPage("backCasesPage");
        document.getElementById("btnIpaky").onclick = () => showPage("ipakyPage");
        document.getElementById("btnAccessories").onclick = () => showPage("accessoriesPage");
        document.getElementById("btnContact").onclick = () => window.open("https://wa.me/8553855378", "_blank");

        // DESIGN GALLERY LOGIC
        const designNames = ["ANIME", "PINTRESTY", "SOFT QUOTES", "HARD QUOTES", "SPORTS", "CARS", "LUXURY", "ACTORS"];

        window.showDesignButtons = function () {
          const container = document.getElementById("designButtons");
          container.innerHTML = designNames.map(name => `<button class="nav-btn" onclick="showDesignGallery('${name}')">${name}</button>`).join("");
          container.style.display = "flex";
          document.getElementById("designGallery").style.display = "none";
          document.getElementById("backToDesigns").style.display = "none";
        };

        window.showDesignGallery = function (category) {
          const gallery = document.getElementById("designGallery");
          currentGalleryImages = (typeof designImages !== "undefined" && designImages[category]) ? designImages[category] : [];
          
          gallery.innerHTML = `<h3 style="grid-column: span 2; text-align:center; width:100%;">${category}</h3>`;
          currentGalleryImages.forEach((src, index) => {
            const img = document.createElement("img");
            img.src = src;
            img.onclick = () => openImageModalAtIndex(index);
            gallery.appendChild(img);
          });

          document.getElementById("designButtons").style.display = "none";
          gallery.style.display = "grid";
          document.getElementById("backToDesigns").style.display = "block";
        };

        window.openImageModalAtIndex = function (index) {
          currentImgIndex = index;
          updateModal();
          document.getElementById("imageModal").style.display = "flex";
          document.body.style.overflow = "hidden";
        };

        window.navigateGallery = function (direction) {
          currentImgIndex += direction;
          if (currentImgIndex >= currentGalleryImages.length) currentImgIndex = 0;
          if (currentImgIndex < 0) currentImgIndex = currentGalleryImages.length - 1;
          updateModal();
        };

        function updateModal() {
          document.getElementById("modalImage").src = currentGalleryImages[currentImgIndex];
          document.getElementById("galleryCounter").innerText = `${currentImgIndex + 1} / ${currentGalleryImages.length}`;
        }

        // SWIPE LOGIC
        let touchStartX = 0;
        document.getElementById("imageModal").addEventListener('touchstart', e => touchStartX = e.changedTouches[0].screenX);
        document.getElementById("imageModal").addEventListener('touchend', e => {
          let touchEndX = e.changedTouches[0].screenX;
          if (touchStartX - touchEndX > 50) navigateGallery(1);
          if (touchEndX - touchStartX > 50) navigateGallery(-1);
        });

        document.getElementById("closeModalBtn").onclick = () => {
          document.getElementById("imageModal").style.display = "none";
          document.body.style.overflow = "auto";
        };

        document.getElementById("printImageBtn").onclick = () => {
          const src = currentGalleryImages[currentImgIndex];
          window.open(`https://wa.me/8553855378?text=Order Design: ${src}`, "_blank");
        };

        // AUTO-INIT Design Buttons
        showDesignButtons();
        goHome();
      });
    </script>
  </body>
</html>
