<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>RAM | HUB</title>
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=0" />
    
    <style>
        :root {
            --nothing-blue: #0a111f; /* Deep Matte Dark Blue */
            --nothing-white: #f5f5f7; /* Matte White */
            --accent-red: #ff0000;    /* Nothing Dot Red */
            --glass-bg: rgba(255, 255, 255, 0.05);
        }

        body {
            margin: 0; padding: 0;
            background-color: var(--nothing-blue);
            color: var(--nothing-white);
            font-family: 'Inter', -apple-system, sans-serif;
            text-transform: uppercase; /* Nothing Brand Feel */
            letter-spacing: 1px;
            overflow-x: hidden;
        }

        /* --- LAYOUT CONTAINERS --- */
        .container {
            max-width: 500px;
            margin: 0 auto;
            padding: 40px 20px;
            min-height: 100vh;
        }

        .page { display: none; animation: slideUp 0.4s cubic-bezier(0.4, 0, 0.2, 1); }
        .active { display: block; }

        @keyframes slideUp {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* --- BUTTONS & CARDS --- */
        .main-btn {
            background: none;
            border: 1px solid var(--nothing-white);
            color: var(--nothing-white);
            padding: 25px;
            width: 100%;
            margin-bottom: 20px;
            font-size: 14px;
            text-align: left;
            cursor: pointer;
            transition: 0.3s;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .main-btn:hover, .main-btn:active {
            background: var(--nothing-white);
            color: var(--nothing-blue);
        }

        /* --- SEARCH INPUT --- */
        .search-wrapper { position: relative; margin-top: 20px; }
        input {
            width: 100%;
            background: none;
            border: none;
            border-bottom: 2px solid var(--nothing-white);
            color: var(--nothing-white);
            padding: 15px 0;
            font-size: 18px;
            outline: none;
        }

        /* --- SEARCH SUGGESTIONS (Google Style) --- */
        #suggBox {
            background: var(--nothing-white);
            color: var(--nothing-blue);
            max-height: 300px;
            overflow-y: auto;
            display: none;
            position: absolute;
            width: 100%;
            z-index: 100;
        }
        .sugg-item {
            padding: 15px;
            border-bottom: 1px solid #ddd;
            font-size: 12px;
            cursor: pointer;
        }

        /* --- RESULT CARD (SURPRISE ANIMATION) --- */
        #resultDisplay {
            margin-top: 40px;
            padding: 30px;
            border: 1px dashed var(--nothing-white);
            display: none;
            text-align: center;
            animation: popIn 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        @keyframes popIn {
            0% { transform: scale(0.5); opacity: 0; }
            100% { transform: scale(1); opacity: 1; }
        }

        .dot { color: var(--accent-red); font-size: 24px; }

        /* --- DESIGN GRID --- */
        .grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 20px; }
        .grid-2 img { width: 100%; height: 250px; object-fit: cover; filter: grayscale(20%); }

        .back-nav { font-size: 10px; margin-bottom: 30px; cursor: pointer; opacity: 0.6; }
    </style>
</head>
<body>

<div class="container">
    
    <div id="homePage" class="page active">
        <h1 style="font-size: 40px; font-weight: 200; margin-bottom: 60px;">RAM <span class="dot">.</span><br>HUB</h1>
        <button class="main-btn" onclick="showPage('designPage')">SKIN SELECTIONS <span>→</span></button>
        <button class="main-btn" onclick="showPage('glassMenu')">TEMPERED GLASS <span>→</span></button>
    </div>

    <div id="glassMenu" class="page">
        <div class="back-nav" onclick="showPage('homePage')">← BACK TO HOME</div>
        <h2>SELECT TYPE<span class="dot">.</span></h2>
        <button class="main-btn" onclick="showPage('gorillaPage')">GORILLA GLASS <span>→</span></button>
        <button class="main-btn" onclick="showPage('uvPage')">UV GLASS <span>→</span></button>
    </div>

    <div id="gorillaPage" class="page">
        <div class="back-nav" onclick="showPage('glassMenu')">← BACK TO SELECTION</div>
        <h2>GORILLA SEARCH<span class="dot">.</span></h2>
        
        <div class="search-wrapper">
            <input type="text" id="glassInput" placeholder="TYPE MODEL NAME..." oninput="handleTyping(this.value)">
            <div id="suggBox"></div>
        </div>

        <div id="resultDisplay">
            <div style="font-size: 10px; opacity: 0.6; margin-bottom: 10px;">PICK THIS GLASS:</div>
            <div id="mainModelName" style="font-size: 28px; font-weight: 900;"></div>
            <div id="compatList" style="font-size: 11px; margin-top: 15px; border-top: 1px solid #333; padding-top: 10px;"></div>
        </div>
    </div>

    <div id="designPage" class="page">
        <div class="back-nav" onclick="showPage('homePage')">← BACK TO HOME</div>
        <h2>DESIGNS<span class="dot">.</span></h2>
        <div id="catButtons"></div>
        <div id="designGrid" class="grid-2"></div>
    </div>

    <div id="uvPage" class="page">
        <div class="back-nav" onclick="showPage('glassMenu')">← BACK</div>
        <h2>UV GLASS<span class="dot">.</span></h2>
        <p style="opacity: 0.5;">UV Inventory Sync Pending...</p>
    </div>

</div>

<script src="data.js"></script>
<script src="design-data.js"></script>

<script>
    // --- PART: PAGE NAVIGATION ---
    function showPage(id) {
        document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
        document.getElementById(id).classList.add('active');
        if(id === 'designPage') renderCats();
        // Clear results when entering search
        if(id === 'gorillaPage') {
            document.getElementById('resultDisplay').style.display = 'none';
            document.getElementById('glassInput').value = '';
        }
    }

    // --- PART: SEARCH LOGIC (THE BRAIN) ---
    function handleTyping(query) {
        const inputVal = query.toLowerCase().replace(/\s+/g, ''); // REMOVE ALL SPACES
        const box = document.getElementById('suggBox');
        const res = document.getElementById('resultDisplay');
        box.innerHTML = '';
        res.style.display = 'none';

        if(!inputVal || typeof temperedGlassData === 'undefined') {
            box.style.display = 'none';
            return;
        }

        // Search in Main and Compatible Models
        const matches = temperedGlassData.filter(item => {
            const mainClean = item.mainModel.toLowerCase().replace(/\s+/g, '');
            const subClean = item.models.some(m => m.toLowerCase().replace(/\s+/g, '').includes(inputVal));
            return mainClean.includes(inputVal) || subClean;
        });

        if(matches.length > 0) {
            box.style.display = 'block';
            matches.slice(0, 12).forEach(match => {
                const div = document.createElement('div');
                div.className = 'sugg-item';
                div.innerHTML = `<strong>${match.mainModel}</strong><br>${match.models.join(' / ')}`;
                div.onclick = () => selectModel(match);
                box.appendChild(div);
            });
        } else {
            box.style.display = 'none';
        }
    }

    function selectModel(data) {
        document.getElementById('suggBox').style.display = 'none';
        document.getElementById('glassInput').value = data.mainModel;
        
        // Surprise Animation Result
        const res = document.getElementById('resultDisplay');
        document.getElementById('mainModelName').innerText = data.mainModel;
        document.getElementById('compatList').innerText = "FITS: " + data.models.join(' | ');
        
        res.style.display = 'block';
    }

    // --- PART: DESIGN GALLERY ---
    function renderCats() {
        const btnBox = document.getElementById('catButtons');
        const cats = Object.keys(designImages || {});
        btnBox.innerHTML = cats.map(c => 
            `<button class="main-btn" style="padding: 10px; font-size: 10px; margin-bottom: 5px;" onclick="loadImages('${c}')">${c} <span>+</span></button>`
        ).join('');
    }

    function loadImages(cat) {
        const grid = document.getElementById('designGrid');
        grid.innerHTML = designImages[cat].map(src => `<img src="${src}">`).join('');
    }
</script>

</body>
</html>
